[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bangla-source-detector"
version = "0.1.0"
description = "Fine-tuned BanglaBERT that tells LLM-generated Bangla from machine-translated Bangla"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mehedi Hasan" }]
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "requests",
]

[project.optional-dependencies]
train = ["torch", "transformers>=4.46", "datasets", "accelerate", "matplotlib"]
app = ["torch", "transformers>=4.46", "gradio"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
